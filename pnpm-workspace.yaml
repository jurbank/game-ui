packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@astrojs/react": ^6.0.6
  "@base-ui/react": ^1.8.0
  "@tailwindcss/cli": ^4.3.3
  "@tailwindcss/node": ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.7
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  happy-dom: ^20.14.5
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  zustand: ^5.0.15
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@parcel/watcher": false
  esbuild: true
minimumReleaseAgeExclude:
  - "@astrojs/react@6.0.6"
